services:
  - type: web
    name: project-nexus-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run api:build
    startCommand: npm run api:start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
