name: Apply Neon Database Migrations

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type APPLY to confirm applying migrations to the Neon production branch"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: neon-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Drizzle migrations
    if: ${{ inputs.confirm_production == 'APPLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate migration secret
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::error::DATABASE_URL_UNPOOLED is not configured."
            exit 1
          fi

      - name: Apply database migrations
        working-directory: apps/api
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: npm run db:migrate
