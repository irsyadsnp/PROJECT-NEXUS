name: Sync API workspace lockfile

on:
  push:
    branches:
      - feat/platform-api-foundation
    paths:
      - "package.json"
      - "apps/api/package.json"
      - "package-lock.json"
      - ".github/workflows/api-lockfile-sync.yml"

permissions:
  contents: write

concurrency:
  group: api-lockfile-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/platform-api-foundation
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate workspace lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): sync Platform API workspace lockfile"
          git push
